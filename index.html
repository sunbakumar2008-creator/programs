code:`package labprogram1;

.sendKeys("9876543210");

System.out.println("Test Case 4 Passed : Check Box");

title:"Program 2 - Selenium Text Box with Test Data",
code:`package seleniumdemo;

import java.io.BufferedReader;
import java.io.FileReader;
import java.time.Duration;

public class DemoTextBox {

public static void main(String[] args) throws Exception {

BufferedReader br =
new BufferedReader(new FileReader("testdata.txt"));

String name = br.readLine();
String email = br.readLine();
String current = br.readLine();
String permanent = br.readLine();

br.close();

WebDriverManager.chromedriver().setup();

WebDriver driver = new ChromeDriver();

driver.manage().window().maximize();

driver.manage().timeouts()
.implicitlyWait(Duration.ofSeconds(10));

driver.get("https://demoqa.com/text-box");

driver.findElement(By.id("userName"))
.sendKeys(name);

driver.findElement(By.id("userEmail"))
.sendKeys(email);

driver.findElement(By.id("currentAddress"))
.sendKeys(current);

driver.findElement(By.id("permanentAddress"))
.sendKeys(permanent);

JavascriptExecutor js =
(JavascriptExecutor) driver;

WebElement submitBtn =
driver.findElement(By.id("submit"));

js.executeScript(
"arguments[0].scrollIntoView(true);",
submitBtn);

Thread.sleep(1000);

js.executeScript(
"arguments[0].click();",
submitBtn);

String outputName =
driver.findElement(By.id("name")).getText();

driver.findElement(By.id("email")).getText();

"program 3": {
title:"Program 3 - Percentage Above 60",
code:`package Mytest;

import java.util.InputMismatchException;
import java.util.Scanner;

public class percentageabove60 {

public static void main(String[] args) {

Scanner scanner = new Scanner(System.in);

try {

System.out.print("Enter the number of students: ");

int studentCount = scanner.nextInt();

scanner.nextLine();

if (studentCount <= 0) {

System.out.println("\\nTC01 : FAIL");
System.out.println(
"Number of students must be greater than zero.");

return;
}

String[] names = new String[studentCount];

int[] percentages =
new int[studentCount];

for (int i = 0; i < studentCount; i++) {

System.out.println(
"\\nStudent Detail " + (i + 1));

System.out.print("Enter Name: ");

names[i] = scanner.nextLine();

System.out.print("Enter Percentage: ");

percentages[i] = scanner.nextInt();

scanner.nextLine();
}

System.out.println(
"\\n========== TEST CASE VERIFICATION ==========");

System.out.println(
"TC01 - Verify Number of Students : PASS");

boolean validName = true;

for (String name : names) {

if (name.trim().isEmpty()) {

validName = false;
break;

}
}

if (validName)

System.out.println(
"TC02 - Verify Student Name : PASS");

else

System.out.println(
"TC02 - Verify Student Name : FAIL");

boolean validPercentage = true;

for (int per : percentages) {

if (per < 0 || per > 100) {

validPercentage = false;
break;

}
}

if (validPercentage)

System.out.println(
"TC03 - Verify Percentage Range (0-100) : PASS");

else {

System.out.println(
"TC03 - Verify Percentage Range (0-100) : FAIL");

return;
}

System.out.println(
"\\nStudents with Percentage Above 60");

boolean found = false;

for (int i = 0; i < studentCount; i++) {

if (percentages[i] > 60) {

System.out.println(
names[i] + " - " + percentages[i] + "%");

found = true;

}
}

if (found)

System.out.println(
"TC04 - Verify Students Above 60 : PASS");

else

System.out.println(
"TC04 - Verify Students Above 60 : FAIL (No Student Above 60)");

System.out.println(
"TC05 - Verify Program Execution : PASS");

}
catch (InputMismatchException e) {

System.out.println(
"\\nTC06 - Verify Invalid Input : PASS");

System.out.println(
"Invalid input! Percentage must be numeric.");

}
finally {

scanner.close();

}
}
}`

function searchProgram(){

let query =
document.getElementById("searchInput")
.value.trim().toLowerCase();

let result =
document.getElementById("result");

if(programs[query]){

let p = programs[query];

result.innerHTML =
'<div class="card">' +
'<h2>' + p.title + '</h2>' +
'<pre id="code"></pre>' +
'<button class="copy" onclick="copyCode()">Copy Code</button>' +
'</div>';

document.getElementById("code")
.textContent = p.code;

}
else{

result.innerHTML =
'<div class="card">' +
'<h2>Program not found</h2>' +
'<p>Enter Program 1, Program 2, Program 3, Program 4, Program 5 or Program 6.</p>' +
'</div>';

}

}

function copyCode(){

let query =
document.getElementById("searchInput")
.value.trim().toLowerCase();

navigator.clipboard.writeText(
programs[query].code
);

alert("Code copied!");

}
